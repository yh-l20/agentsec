<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="3200" viewBox="0 0 2400 3200" fill="none" role="img" aria-labelledby="v07-title v07-desc">
  <title id="v07-title">界令 0.7：先定范围，让 AI 自己完成</title>
  <desc id="v07-desc">界令 0.7 预览版系统海报。先选资料与允许的去向，让 AI 在本次范围内自动发消息、上传和填表。有明确标签的敏感字段在交给模型前隐藏。五层检查覆盖环境与技能、外部资料、长期记忆、任务偏移和危险命令，继续使用 Hermes 与 OpenClaw 原生网页。仅覆盖已接入的操作和明确标签字段，仍可能误拦或漏检；其余选定资料会进入你连接的模型。Linux / WSL，固定版本接入。官网与仓库提供实机视频、代码及结果记录。</desc>
